name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfs_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: demand_forecast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dfs_admin -d demand_forecast"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # CI-only throwaway credentials for the service container above.
      DATABASE_URL: postgresql://dfs_admin:ci-only-password@localhost:5432/demand_forecast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check dfs tests
      # Unit tests plus the PostgreSQL integration tests (isolated schema, synthetic data).
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
